<style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;-webkit-text-size-adjust:100%}.login{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px}.lg{width:100%;max-width:320px;display:grid;gap:12px;justify-items:center;text-align:center}.lg h2{margin:0;font-size:20px}.lg input[type=password]{text-align:center}.lg .btn{width:100%}.chip{font-size:14px;padding:7px 12px}.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-radius:9px;padding:2px;gap:2px}.seg button{all:unset;text-align:center;padding:6px 0;font-size:13px;border-radius:7px;cursor:pointer;color:var(--fg)}.seg button[aria-pressed=true]{background:var(--panel);box-shadow:0 1px 3px #0002;font-weight:700}.ahHead{display:grid;gap:2px}.ahVal{font-size:52px;font-weight:700;letter-spacing:-2px;color:var(--fg)}.ahUnit{font-size:20px;color:var(--mute);margin-left:2px;font-weight:600}.ahDate{font-size:16px;color:var(--mute);font-weight:600}.graph .ax{fill:var(--mute);font-size:17px}.ahAvg{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:16px;padding:16px 18px;font-size:17px}.ahAvg b{font-size:18px}.ahAbout{background:var(--bg);padding:20px 16px 90px}.ahAbout h3{font-size:24px;margin:0 0 12px}.ahAbout p{background:var(--panel);border-radius:16px;padding:18px;margin:0;font-size:17px;line-height:1.6}</style>
<title>내 건강검진 대시보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: 폰 앱 꼴 — 위 제목줄 · 항목 고르는 칩 · 본문(탭별) · 아래 탭바 4칸 */
:root{
  --bg:#f3f6f5;--panel:#ffffff;--fg:#17201d;--mute:#5d6b66;--line:#dfe6e3;
  --accent:#16795f;--accent-soft:#e1f1eb;--hi:#c2362b;--hi-soft:#fbe6e3;--lo:#2a64b8;--lo-soft:#e3ecf9;
  --ui:'IBM Plex Sans KR',system-ui,sans-serif;--num:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715;--panel:#19211e;--fg:#e6eeeb;--mute:#97a7a1;--line:#2b3733;
  --accent:#4cc39c;--accent-soft:#183128;--hi:#f07a6f;--hi-soft:#3a1f1c;--lo:#7aa8ec;--lo-soft:#1b2639;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715;--panel:#19211e;--fg:#e6eeeb;--mute:#97a7a1;--line:#2b3733;
  --accent:#4cc39c;--accent-soft:#183128;--hi:#f07a6f;--hi-soft:#3a1f1c;--lo:#7aa8ec;--lo-soft:#1b2639;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{padding-block:14px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
h1{font-size:18px;margin:0}
.st{font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.band{background:var(--accent);color:var(--panel);padding:6px 16px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
main{flex:1;overflow:auto;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.list{list-style:none;margin:0;padding:0}
.list li button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);cursor:pointer}
.list li button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.list .d{flex:1;font-size:17px}
.list .org{display:block;font-size:12px;color:var(--mute)}
.list .v{font-family:var(--num);font-size:18px;font-variant-numeric:tabular-nums}
.list .v.hi{color:var(--hi)}.list .v.lo{color:var(--lo)}.list .v.none{color:var(--mute);font-size:13px;font-family:var(--ui)}
.list .chev{color:var(--mute)}
.empty{color:var(--mute);padding:32px 16px;text-align:center}
.pad{padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.graph svg{width:100%;height:auto;display:block}
.graph text{fill:var(--mute);font-size:11px;font-family:var(--ui)}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.pill.hi{background:var(--hi-soft);color:var(--hi)}.pill.lo{background:var(--lo-soft);color:var(--lo)}
.sumrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sumrow .n small{color:var(--mute);font-size:12px;margin-left:4px}
.sumrow .x{font-family:var(--num)}
.sec{background:var(--accent-soft);color:var(--accent);font-weight:500;padding:6px 16px;font-size:14px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.set input{max-width:150px}
label{font-size:13px;color:var(--mute);display:grid;gap:3px}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;font-size:16px}
button.btn{font:inherit;font-size:15px;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);cursor:pointer}
button.btn.ghost{background:transparent;color:var(--accent)}button.btn.del{background:transparent;color:var(--hi);border-color:var(--hi)}
.msg{font-size:13px;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:8px 0;font-size:12px;color:var(--mute)}
nav button[aria-current="page"]{color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--panel);font-size:28px;cursor:pointer;box-shadow:0 3px 10px #0003;z-index:6}
.sheet{position:fixed;inset:0;background:#0006;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--panel);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
[hidden]{display:none!important}</style>

</head><body>
<div class="login" id="login" hidden><form class="lg" id="lgForm">
  <img src="/apple-touch-icon.png" alt="" width="72" height="72" style="border-radius:18px">
  <h2>건강검진 기록</h2>
  <p class="msg">본인 기록입니다. 비밀번호를 넣어 주세요.</p>
  <input type="password" id="lgPw" placeholder="비밀번호" autocomplete="current-password">
  <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="lgKeep" checked style="width:auto">이 기기에서 로그인 유지</label>
  <button class="btn" type="submit">로그인</button>
  <span class="msg" id="lgMsg"></span>
</form></div>
<div class="app">
  <header><h1 id="ttl">기록</h1><div class="st" id="status">기록을 불러오는 중…</div></header>
  <div class="chips" id="chips"></div>
  <div class="band" id="band"></div>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="검진 결과 입력">+</button>
<nav><div class="in">
  <button data-tab="rec" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>기록</button>
  <button data-tab="graph"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/></svg>그래프</button>
  <button data-tab="sum"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>요약</button>
  <button data-act="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>입력</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>설정</button>
</div></nav>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>

<script>
const ITEMS=[["WT","체중","kg",null,null],["BF","체지방률","%",10,20],["AST","AST(SGOT)","IU/L",0,40],["ALT","ALT(SGPT)","IU/L",0,40],
["GGT","감마지피티","IU/L",0,56],["TC","총콜레스테롤","mg/dL",null,199],["TG","중성지방","mg/dL",null,149],
["HDL","HDL 콜레스테롤","mg/dL",40,null],["LDL","LDL 콜레스테롤","mg/dL",null,129],["GLU","공복혈당","mg/dL",70,99],
["UA","요산","mg/dL",2.8,7.7],["HBA1C","당화혈색소","%",4,5.6]];
const $=id=>document.getElementById(id);
let rows=[],settings={item:"GGT",next:""},col=null,tab="rec";
try{const s=localStorage.getItem("hc.item");if(s)settings.item=s;}catch(e){}
const it=id=>ITEMS.find(i=>i[0]===id)||ITEMS[0];
function judge(id,v){const i=it(id);if(v==null)return"none";if(i[3]!=null&&v<i[3])return"lo";if(i[4]!=null&&v>i[4])return"hi";return"ok";}
const fmt=v=>v==null?"":(+v).toLocaleString("ko-KR",{maximumFractionDigits:2});
const WD="일월화수목금토";
const dlabel=d=>{const t=new Date(d+"T00:00");return`${d.replaceAll("-",".")} (${WD[t.getDay()]})`;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sorted=()=>rows.slice().sort((a,b)=>b.dt.localeCompare(a.dt));

function chips(){const show=tab==="rec"||tab==="graph";$("chips").hidden=!show;$("band").hidden=!show;if(!show)return;
  $("chips").innerHTML=ITEMS.map(([id,n])=>`<button class="chip" data-id="${id}" aria-pressed="${id===settings.item}">${n}</button>`).join("");
  const i=it(settings.item);$("band").innerHTML=`<span>${i[1]} (${i[2]})</span><span>기준 ${i[3]??""}${i[3]!=null||i[4]!=null?"~":"없음"}${i[4]??""}</span>`;}
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;settings.item=b.dataset.id;try{localStorage.setItem("hc.item",b.dataset.id)}catch(e){}render();};

function vRec(){const ds=sorted();if(!ds.length)return`<p class="empty">아직 기록이 없습니다.<br>오른쪽 아래 <b>+</b> 로 첫 검진을 넣어 주세요.</p>`;
  return`<ul class="list">${ds.map(r=>{const v=r.v?.[settings.item];const j=judge(settings.item,v);
    return`<li><button data-dt="${r.dt}"><span class="d">${dlabel(r.dt)}<span class="org">${esc(r.org)}</span></span><span class="v ${j}">${v==null?"값 없음":fmt(v)}</span><span class="chev">›</span></button></li>`;}).join("")}</ul>`;}

let gRange="all",gSel=-1;
const ABOUT={WT:"체중은 건강검진 때 잰 몸무게입니다. 혈압 · 혈당 · 간수치와 함께 보면 변화의 원인을 짐작하기 쉽습니다.",
BF:"체지방률은 몸무게 가운데 지방이 차지하는 비율입니다.",
AST:"AST는 간 · 심장 · 근육 세포에 있는 효소로, 이 조직이 손상되면 혈액 속 수치가 올라갑니다.",
ALT:"ALT는 주로 간세포에 있는 효소라 간 손상을 가장 직접 보여 주는 수치입니다.",
GGT:"감마지피티는 간과 담도에서 나오는 효소로, 음주 · 지방간 · 약물의 영향을 잘 받습니다.",
TC:"총콜레스테롤은 혈액 속 콜레스테롤 전체 양입니다. LDL · HDL 과 함께 봐야 뜻이 분명해집니다.",
TG:"중성지방은 쓰고 남은 열량이 저장되는 지방입니다. 식사 · 음주 직후에는 높게 나올 수 있습니다.",
HDL:"HDL은 혈관의 콜레스테롤을 간으로 되돌려 보내는 「좋은」 콜레스테롤이라 높을수록 좋습니다.",
LDL:"LDL은 혈관 벽에 쌓이기 쉬운 「나쁜」 콜레스테롤이라 낮을수록 좋습니다.",
GLU:"공복혈당은 8시간 이상 굶은 뒤 잰 혈액 속 포도당 농도입니다. 100~125 mg/dL 이면 공복혈당장애, 126 이상이면 당뇨를 의심합니다.",
UA:"요산은 퓨린이 분해되고 남는 물질로, 높으면 통풍의 원인이 됩니다.",
HBA1C:"당화혈색소는 최근 2~3개월의 평균 혈당을 보여 줍니다. 5.7~6.4% 는 당뇨 전단계, 6.5% 이상은 당뇨를 의심합니다."};
function vGraph(){const i=it(settings.item);let p=rows.filter(r=>r.v?.[i[0]]!=null).sort((a,b)=>a.dt.localeCompare(b.dt));
  const seg=[["1y","1년"],["3y","3년"],["5y","5년"],["10y","10년"],["all","전체"]];
  const segH=`<div class="seg">${seg.map(([k,n])=>`<button data-rg="${k}" aria-pressed="${gRange===k}">${n}</button>`).join("")}</div>`;
  if(gRange!=="all"&&p.length){const last=new Date(p[p.length-1].dt);last.setFullYear(last.getFullYear()-{"1y":1,"3y":3,"5y":5,"10y":10}[gRange]);const cut=last.toISOString().slice(0,10);p=p.filter(r=>r.dt>cut);}
  const about=`<div class="ahAbout"><h3>${i[1]}에 관하여</h3><p>${ABOUT[i[0]]||""}${i[3]!=null||i[4]!=null?`<br><span class="msg">참고 범위 ${i[3]??""}~${i[4]??""} ${i[2]}</span>`:""}</p></div>`;
  if(!p.length)return`<div class="pad ah">${segH}<p class="empty">이 기간에 ${i[1]} 기록이 없습니다.</p></div>${about}`;
  if(gSel<0||gSel>=p.length)gSel=p.length-1;
  const vals=p.map(r=>r.v[i[0]]),sel=p[gSel],sv=sel.v[i[0]],sj=judge(i[0],sv);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const W=600,H=360,L=4,R=56,T=10,B=34;
  const top=Math.max(...vals,i[4]||0),raw=top/3,mag=Math.pow(10,Math.floor(Math.log10(raw||1))),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw),mx=step*3;
  const n=p.length,X=k=>n===1?(L+W-R)/2:L+20+k*(W-L-R-40)/(n-1),Y=v=>T+(mx-v)*(H-T-B)/mx;
  const xt=Math.max(1,Math.ceil(n/4));
  const xs=p.map((r,k)=>k).filter(k=>k%xt===0);
  return`<div class="pad ah">${segH}
  <div class="ahHead"><div><span class="ahVal">${fmt(sv)}</span><span class="ahUnit">${i[2]}</span></div>
    <div class="ahDate">${sel.dt.slice(0,4)}년 ${+sel.dt.slice(5,7)}월 ${+sel.dt.slice(8,10)}일 (${WD[new Date(sel.dt+"T00:00").getDay()]})${sj==="hi"?' · <b style="color:var(--hi)">기준보다 높음</b>':sj==="lo"?' · <b style="color:var(--lo)">기준보다 낮음</b>':""}</div></div>
  <div class="graph"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${i[1]} 추이">
  <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="none" stroke="var(--line)"/>
  ${[1,2].map(k=>`<line x1="${L}" x2="${W-R}" y1="${Y(step*k)}" y2="${Y(step*k)}" stroke="var(--line)"/>`).join("")}
  ${[0,1,2,3].map(k=>`<text x="${W-R+8}" y="${Y(step*k)+5}" class="ax">${fmt(step*k)}</text>`).join("")}
  ${xs.map(k=>`<line x1="${X(k)}" x2="${X(k)}" y1="${T}" y2="${H-B+24}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${X(k)+4}" y="${H-10}" class="ax">${p[k].dt.slice(0,4)}.${p[k].dt.slice(5,7)}</text>`).join("")}
  ${p.map((r,k)=>{const v=r.v[i[0]];return`<g data-k="${k}" style="cursor:pointer"><rect x="${X(k)-14}" y="${T}" width="28" height="${H-T-B}" fill="transparent"/>${k===gSel?`<line x1="${X(k)}" x2="${X(k)}" y1="${T}" y2="${H-B}" stroke="var(--hi)" opacity=".35"/>`:""}<circle cx="${X(k)}" cy="${Y(v)}" r="${k===gSel?9:7}" fill="#e5484d"/></g>`;}).join("")}
  </svg></div>
  <div class="ahAvg"><span>${gRange==="all"?"전체":seg.find(s=>s[0]===gRange)[1]} 평균</span><b>${fmt(Math.round(avg*10)/10)}${i[2]}</b></div>
  <div class="ahAvg"><span>최저 · 최고</span><b>${fmt(Math.min(...vals))} · ${fmt(Math.max(...vals))}${i[2]}</b></div>
  </div>${about}`;}
document.addEventListener("click",e=>{const s=e.target.closest("[data-rg]");if(s){gRange=s.dataset.rg;gSel=-1;render();return;}
  const g=e.target.closest("svg g[data-k]");if(g){gSel=+g.dataset.k;render();}});
function vSum(){const ds=sorted();if(!ds.length)return`<p class="empty">기록이 없습니다.</p>`;const l=ds[0];
  let c={hi:0,lo:0,ok:0};ITEMS.forEach(([id])=>{const j=judge(id,l.v?.[id]);if(c[j]!=null)c[j]++;});
  const next=settings.next?`<p class="msg">다음 검진 예정 <b>${dlabel(settings.next)}</b></p>`:"";
  return`<div class="pad"><div><b>${dlabel(l.dt)}</b> <span class="msg">${esc(l.org)} · 총 ${ds.length}회</span></div>
  <div class="kv"><span class="pill">정상 ${c.ok}</span>${c.hi?`<span class="pill hi">높음 ${c.hi}</span>`:""}${c.lo?`<span class="pill lo">낮음 ${c.lo}</span>`:""}</div>${next}
  <div>${ITEMS.map(([id,n,u])=>{const v=l.v?.[id];if(v==null)return"";const prev=ds.slice(1).find(r=>r.v?.[id]!=null);const d=prev?v-prev.v[id]:null;const j=judge(id,v);
    return`<div class="sumrow"><span class="n">${n}<small>${u}</small></span><span class="x" style="color:var(--mute);font-size:13px">${d==null?"":(d>0?"▲":d<0?"▼":"–")+" "+fmt(Math.abs(d))}</span><span class="pill ${j==="ok"?"":j}">${fmt(v)}</span></div>`;}).join("")}</div></div>`;}

function vSet(){return`<div class="sec">기본 설정</div>
  <div class="set"><span>처음 보여 줄 항목</span><span>${it(settings.item)[1]}</span></div>
  <div class="set"><span>다음 검진 예정일</span><input type="date" id="nextDt" value="${settings.next||""}"></div>
  <div class="sec">자료 가져오기</div>
  <div class="pad"><label>예전 화면에서 내보낸 CSV (검진일, 기관, 항목ID, 결과)<input type="file" id="csv" accept=".csv,text/csv"></label>
  <span class="msg" id="setMsg">기록은 본인만 볼 수 있게 저장되고, PC · 폰 어디서 열어도 같습니다.</span></div>`;}

function render(){chips();$("ttl").textContent={rec:"기록",graph:"그래프",sum:"요약",set:"설정"}[tab];
  $("main").innerHTML=tab==="rec"?vRec():tab==="graph"?vGraph():tab==="sum"?vSum():vSet();
  document.querySelectorAll("nav button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.tab===tab)||b.dataset.tab===tab&&b.setAttribute("aria-current","page"));
  $("fab").hidden=tab==="set";
  if(tab==="set"){$("nextDt").onchange=e=>saveSettings({next:e.target.value});$("csv").onchange=importCsv;}}
document.querySelector("nav").onclick=e=>{if(e.target.closest("button[data-act=add]")){openSheet(null);return;}const b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;render();$("main").scrollTop=0;};
$("main").addEventListener("click",e=>{const b=e.target.closest("button[data-dt]");if(b)openSheet(rows.find(r=>r.dt===b.dataset.dt));});
$("fab").onclick=()=>openSheet(null);
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").hidden=true;};

function openSheet(r){
  $("sheetBox").innerHTML=`<div class="row" style="justify-content:space-between"><b>${r?dlabel(r.dt)+" 고치기":"검진 결과 입력"}</b><button class="btn ghost" id="shClose">닫기</button></div>
  <div class="form"><label>검진일 *<input type="date" id="dt" value="${r?.dt||""}" ${r?"disabled":""}></label><label>검진기관<input id="org" value="${esc(r?.org)}" placeholder="예: 아산병원"></label>
  ${ITEMS.map(([id,n,u])=>`<label>${n} (${u})<input type="number" step="any" inputmode="decimal" id="v_${id}" value="${r?.v?.[id]??""}"></label>`).join("")}</div>
  <div class="row"><button class="btn" id="shSave">저장</button>${r?`<button class="btn del" id="shDel">이 회차 지우기</button>`:""}<span class="msg" id="shMsg"></span></div>`;
  $("sheet").hidden=false;$("shClose").onclick=()=>$("sheet").hidden=true;
  $("shSave").onclick=async()=>{const dt=$("dt").value;if(!dt)return $("shMsg").textContent="검진일을 넣어 주세요.";
    const v={};ITEMS.forEach(([id])=>{const x=$("v_"+id).value;if(x!=="")v[id]=+x;});
    if(!Object.keys(v).length)return $("shMsg").textContent="입력한 결과가 없습니다.";
    try{await col.doc(dt).set({dt,org:$("org").value.trim(),v});$("sheet").hidden=true;}catch(e){$("shMsg").textContent="저장하지 못했습니다: "+(e.message||e.code);}};
  if(r){let armed=false;$("shDel").onclick=async()=>{if(!armed){armed=true;$("shDel").textContent="한 번 더 누르면 지웁니다";return;}
    try{await col.doc(r.dt).delete();$("sheet").hidden=true;}catch(e){$("shMsg").textContent="지우지 못했습니다: "+(e.message||e.code);}};}
}

async function saveSettings(p){settings={...settings,...p};try{await col?.doc("_settings").set({next:settings.next||""});}catch(e){}}
async function importCsv(e){const f=e.target.files[0];if(!f)return;const txt=(await f.text()).replace(/^﻿/,"");const by={};
  txt.split(/\r?\n/).forEach(l=>{const c=l.split(",");if(c.length<4||!/^\d{4}-\d{2}-\d{2}$/.test(c[0]))return;const val=parseFloat(c[c.length-1]);if(isNaN(val))return;
    (by[c[0]]??={org:c.slice(1,c.length-2).join(",").trim(),v:{}}).v[c[c.length-2].trim()]=val;});
  const ks=Object.keys(by);if(!ks.length)return $("setMsg").textContent="CSV 에서 읽을 줄이 없습니다.";
  if(!confirm(`지금 기록 ${rows.length}회차를 지우고 CSV 의 ${ks.length}회차로 덮어씁니다. 계속할까요?`))return;
  try{const o={};ks.forEach(k=>o[k]={dt:k,org:by[k].org||"",v:by[k].v});await replaceAll(o);
    $("setMsg").textContent=`CSV 의 ${ks.length}회차로 덮어썼습니다.`;}catch(err){$("setMsg").textContent="가져오지 못했습니다: "+(err.message||err.code);}}

render();
(()=>{const KK="fiti_health_key";let subs=[],store={};
  const getK=()=>{try{return localStorage.getItem(KK)||sessionStorage.getItem(KK);}catch(e){return null;}};
  const emit=()=>{const docs=Object.keys(store).map(id=>({id,data:()=>store[id]}));subs.forEach(f=>f({docs}));};
  async function api(method,key,data){
    const r=await fetch("/api/health",{method,headers:{"x-key":key,"Content-Type":"application/json"},body:data?JSON.stringify({store:data}):undefined});
    const j=await r.json().catch(()=>({}));
    if(r.status===401)throw new Error("비밀번호가 맞지 않습니다.");
    if(!r.ok)throw new Error(j.message||("서버 오류 "+r.status));return j;}
  async function persist(){await api("POST",getK(),store);}
  window.replaceAll=async o=>{const st=store._settings;store=o;if(st)store._settings=st;emit();await persist();};
  col={doc:id=>({set:async o=>{store[id]=o;emit();await persist();},delete:async()=>{delete store[id];emit();await persist();}}),
       onSnapshot:(f)=>{subs.push(f);}};
  col.onSnapshot(s=>{const all=s.docs.map(d=>({id:d.id,...d.data()}));
    const st=all.find(x=>x.id==="_settings");if(st)settings.next=st.next||"";
    rows=all.filter(x=>x.dt);$("status").textContent=`로그인됨 · ${rows.length}회차 · `;
    const a=document.createElement("a");a.href="#";a.textContent="로그아웃";a.style.color="inherit";
    a.onclick=e=>{e.preventDefault();try{localStorage.removeItem(KK);sessionStorage.removeItem(KK);}catch(x){}location.reload();};
    $("status").appendChild(a);render();});
  const gate=$("login");
  async function login(key,keep){
    $("lgMsg").textContent="확인 중…";
    try{const j=await api("GET",key);
      try{(keep?localStorage:sessionStorage).setItem(KK,key);}catch(e){}
      store=j.store||{};
      gate.hidden=true;emit();}
    catch(e){$("lgMsg").textContent=e.message==="Failed to fetch"?"서버에 연결할 수 없습니다.":e.message;gate.hidden=false;$("lgPw").focus();}}
  $("lgForm").onsubmit=e=>{e.preventDefault();const k=$("lgPw").value.trim();if(k)login(k,$("lgKeep").checked);};
  const k=getK();if(k)login(k,true);else{gate.hidden=false;$("lgPw").focus();}
})();
</script>
</body></html>
